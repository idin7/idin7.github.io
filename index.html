<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Professional Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #0f1629;
    --card: #131d35;
    --blue: #3b82f6;
    --cyan: #06b6d4;
    --green: #10b981;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: #1e2d4a;
    --gradient: linear-gradient(135deg, #3b82f6, #06b6d4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', 'Space Grotesk', sans-serif;
    overflow-x: hidden;
  }

  /* ---- LANG TOGGLE ---- */
  .lang-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 32px;
    background: rgba(10,14,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; color: var(--cyan); }
  .lang-toggle {
    display: flex; gap: 4px; background: var(--card); border-radius: 8px; padding: 4px;
  }
  .lang-btn {
    padding: 6px 16px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    background: transparent; color: var(--muted);
  }
  .lang-btn.active { background: var(--gradient); color: #fff; }

  /* ---- HERO ---- */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding-top: 60px;
  }
  canvas#net { position: absolute; inset: 0; opacity: 0.35; }

  .hero-content { position: relative; z-index: 2; text-align: center; padding: 0 20px; }
  .hero-badge {
    display: inline-block; margin-bottom: 24px;
    padding: 6px 18px; border-radius: 20px;
    background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.4);
    font-size: 0.8rem; letter-spacing: 3px; color: var(--cyan);
    font-family: 'Space Grotesk', sans-serif; text-transform: uppercase;
  }
  .hero-name {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700; line-height: 1.1;
    background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 16px;
  }
  .hero-title {
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    color: var(--muted); font-weight: 400; margin-bottom: 32px; max-width: 600px; margin-inline: auto;
  }
  .hero-cta {
    display: inline-block; padding: 14px 36px; border-radius: 10px;
    background: var(--gradient); color: #fff; font-weight: 600; font-size: 1rem;
    text-decoration: none; cursor: pointer; border: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 30px rgba(59,130,246,0.35);
  }
  .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 0 45px rgba(59,130,246,0.55); }

  /* ---- SECTION ---- */
  section { padding: 90px 24px; max-width: 1100px; margin: 0 auto; }
  .section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 700; margin-bottom: 48px;
  }
  .divider { width: 60px; height: 3px; background: var(--gradient); border-radius: 2px; margin-bottom: 48px; }

  /* ---- ABOUT ---- */
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .about-text { font-size: 1.05rem; line-height: 1.9; color: #94a3b8; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; text-align: center;
    transition: border-color 0.3s;
  }
  .stat-card:hover { border-color: var(--blue); }
  .stat-num { font-size: 2.2rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  /* ---- SKILLS ---- */
  .skills-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .skill-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; transition: all 0.3s; position: relative; overflow: hidden;
  }
  .skill-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--gradient); opacity: 0; transition: opacity 0.3s;
  }
  .skill-card:hover { transform: translateY(-4px); border-color: var(--blue); }
  .skill-card:hover::before { opacity: 1; }
  .skill-icon { font-size: 2.2rem; margin-bottom: 16px; }
  .skill-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
  .skill-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tag {
    padding: 3px 10px; border-radius: 6px; font-size: 0.72rem;
    background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25);
    color: var(--cyan); font-family: 'Space Grotesk', sans-serif;
  }

  /* ---- SERVICES ---- */
  .services-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .svc-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px; display: flex; gap: 18px; align-items: flex-start;
    transition: all 0.3s;
  }
  .svc-card:hover { background: var(--card); border-color: var(--cyan); }
  .svc-icon {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    background: rgba(6,182,212,0.15); display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
  }
  .svc-name { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  .svc-desc { font-size: 0.87rem; color: var(--muted); line-height: 1.7; }

  /* ---- CONTACT ---- */
  .contact-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .contact-text { font-size: 1.05rem; color: #94a3b8; line-height: 1.9; }
  .contact-items { display: flex; flex-direction: column; gap: 16px; }
  .contact-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; transition: border-color 0.3s;
  }
  .contact-item:hover { border-color: var(--blue); }
  .c-icon { font-size: 1.3rem; }
  .c-label { font-size: 0.78rem; color: var(--muted); }
  .c-val { font-size: 0.95rem; font-weight: 500; color: var(--cyan); }

  /* ---- FOOTER ---- */
  footer {
    text-align: center; padding: 32px;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.85rem;
  }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 720px) {
    .about-grid, .contact-wrap { grid-template-columns: 1fr; }
    .lang-bar { padding: 12px 18px; }
  }

  /* ---- SCROLL REVEAL ---- */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s, transform 0.7s; }
  .reveal.visible { opacity: 1; transform: none; }

  /* ---- LTR for EN ---- */
  html[lang="en"] { direction: ltr; }
  html[lang="en"] body { font-family: 'Space Grotesk', sans-serif; }
</style>

<script>
// ---- NETWORK CANVAS ----
const canvas = document.getElementById('net');
const ctx = canvas.getContext('2d');
let nodes = [];
const NUM = 55;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initNodes(); });

function initNodes() {
  nodes = Array.from({length: NUM}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    r: Math.random() * 2.5 + 1
  }));
}
initNodes();

function drawNet() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  nodes.forEach(n => {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
    if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
  });
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 140) {
        ctx.strokeStyle = `rgba(59,130,246,${1 - dist/140})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
      }
    }
    ctx.beginPath();
    ctx.arc(nodes[i].x, nodes[i].y, nodes[i].r, 0, Math.PI * 2);
    ctx.fillStyle = '#06b6d4';
    ctx.fill();
  }
  requestAnimationFrame(drawNet);
}
drawNet();

// ---- LANGUAGE SWITCH ----
let currentLang = 'fa';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.querySelectorAll('[data-fa]').forEach(el => {
    el.textContent = lang === 'fa' ? el.dataset.fa : el.dataset.en;
  });
}
setLang('fa');

// ---- SCROLL REVEAL ----
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
