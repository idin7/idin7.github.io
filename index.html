  <style>
/* ===== FONTS ===== */
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ===== COLOR TOKENS ===== */
:root {
  --blue-50:#eef4fb;--blue-100:#d6e4f5;--blue-200:#adc8ea;--blue-300:#7fa6da;
  --blue-400:#4f7fc4;--blue-500:#2c5da8;--blue-600:#1f4a8c;--blue-700:#173a6e;
  --blue-800:#122c52;--blue-900:#0e2038;
  --molten-50:#fef3ec;--molten-100:#fcdfcb;--molten-200:#f9be96;--molten-300:#f59a60;
  --molten-400:#f2742c;--molten-500:#e2611a;--molten-600:#c04e12;--molten-700:#983e10;
  --molten-800:#6e2e0e;--molten-900:#4a2009;
  --steel-0:#ffffff;--steel-25:#f7f9fb;--steel-50:#f1f4f7;--steel-100:#e5eaef;
  --steel-200:#cfd7de;--steel-300:#b0bcc6;--steel-400:#8694a1;--steel-500:#647280;
  --steel-600:#4b5763;--steel-700:#38424c;--steel-800:#262d35;--steel-900:#161b21;
  --steel-950:#0c1014;
  --cat-profile:#2c5da8;--cat-gas:#f2b705;--cat-water:#1c9cd8;
  --cat-industrial:#647280;--cat-section:#f2742c;--cat-custom:#6d4a9e;
  --success-500:#2e9e5b;--success-50:#e9f6ee;--warning-500:#e0a412;--warning-50:#fcf4e0;
  --danger-500:#d64545;--danger-50:#fbeaea;
  --sheen-light:linear-gradient(135deg,#f7f9fb 0%,#e5eaef 38%,#ffffff 50%,#cfd7de 64%,#eef1f5 100%);
  --sheen-dark:linear-gradient(135deg,#38424c 0%,#262d35 40%,#4b5763 52%,#1a2027 68%,#38424c 100%);
  --sheen-molten:linear-gradient(135deg,#f59a60 0%,#f2742c 45%,#ffb27a 55%,#e2611a 70%,#f2742c 100%);
  --surface-page:var(--steel-25);--surface-card:var(--steel-0);
  --surface-sunken:var(--steel-50);--surface-inverse:var(--steel-900);
  --surface-brand:var(--blue-600);--surface-brand-soft:var(--blue-50);
  --text-strong:var(--steel-900);--text-body:var(--steel-700);--text-muted:var(--steel-500);
  --text-subtle:var(--steel-400);--text-on-brand:#ffffff;--text-on-accent:#ffffff;
  --text-link:var(--blue-600);
  --border-subtle:var(--steel-100);--border-default:var(--steel-200);
  --border-strong:var(--steel-300);--border-brand:var(--blue-500);
  --action-primary:var(--blue-600);--action-primary-hover:var(--blue-700);
  --action-primary-press:var(--blue-800);--action-accent:var(--molten-400);
  --action-accent-hover:var(--molten-500);--action-accent-press:var(--molten-600);
  --focus-ring:0 0 0 3px color-mix(in srgb,var(--blue-500) 35%,transparent);
}

/* ===== TYPOGRAPHY TOKENS ===== */
:root {
  --font-sans:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-display:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --fw-light:300;--fw-regular:400;--fw-medium:500;--fw-semibold:600;
  --fw-bold:700;--fw-extrabold:800;--fw-black:900;
  --fs-display-1:clamp(2.6rem,1.6rem + 4.4vw,4.5rem);
  --fs-display-2:clamp(2.1rem,1.4rem + 3.1vw,3.4rem);
  --fs-h1:clamp(1.8rem,1.3rem + 2.1vw,2.6rem);
  --fs-h2:clamp(1.5rem,1.2rem + 1.3vw,2rem);
  --fs-h3:clamp(1.25rem,1.1rem + 0.7vw,1.5rem);
  --fs-h4:1.15rem;
  --fs-lg:1.125rem;--fs-md:1rem;--fs-sm:0.875rem;--fs-xs:0.75rem;--fs-2xs:0.6875rem;
  --lh-tight:1.15;--lh-snug:1.3;--lh-normal:1.6;--lh-relaxed:1.85;
  --ls-eyebrow:0.14em;--ls-tight:-0.01em;
  --type-heading-weight:var(--fw-bold);
  --type-body-line:var(--lh-relaxed);
}

/* ===== SPACING / RADIUS / SHADOW / MOTION ===== */
:root {
  --space-0:0;--space-1:.25rem;--space-2:.5rem;--space-3:.75rem;
  --space-4:1rem;--space-5:1.5rem;--space-6:2rem;--space-7:2.5rem;
  --space-8:3rem;--space-9:4rem;--space-10:5rem;--space-12:7rem;
  --container-max:1240px;
  --container-pad:clamp(1rem,.5rem + 2.5vw,3rem);
  --section-y:clamp(3.5rem,2rem + 6vw,7rem);
  --radius-xs:3px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;
  --radius-xl:22px;--radius-pill:999px;--radius-round:50%;
  --bw-hair:1px;--bw-1:1.5px;--bw-2:2px;--bw-3:3px;
  --shadow-xs:0 1px 2px rgba(22,27,33,.06);
  --shadow-sm:0 2px 6px rgba(22,27,33,.07),0 1px 2px rgba(22,27,33,.05);
  --shadow-md:0 8px 20px -8px rgba(22,27,33,.14),0 2px 6px rgba(22,27,33,.06);
  --shadow-lg:0 18px 40px -16px rgba(18,44,82,.22),0 4px 12px rgba(22,27,33,.08);
  --shadow-brand:0 14px 30px -12px rgba(31,74,140,.42);
  --shadow-accent:0 12px 26px -10px rgba(226,97,26,.45);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(22,27,33,.05);
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-fast:120ms;--dur-base:200ms;--dur-slow:360ms;
}

/* ===== BASE RESET ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);font-size:var(--fs-md);line-height:var(--type-body-line);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[dir="ltr"],[lang="en"]{direction:ltr}
[dir="rtl"],[lang="fa"],[lang="ar"]{direction:rtl}
h1,h2,h3,h4,h5,h6{margin:0;font-family:var(--font-display);font-weight:var(--type-heading-weight);line-height:var(--lh-snug);color:var(--text-strong);text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:var(--text-link);text-decoration:none}
a:hover{text-decoration:underline}
img,svg{display:block;max-width:100%}
button{font-family:inherit}
.spec,.num-lat{font-family:var(--font-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.eyebrow{font-size:var(--fs-2xs);font-weight:var(--fw-bold);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--action-accent)}
[dir="rtl"] .eyebrow{letter-spacing:.04em}
.container{width:100%;max-width:var(--container-max);margin-inline:auto;padding-inline:var(--container-pad)}
.bg-blueprint{background-color:var(--blue-900);background-image:linear-gradient(color-mix(in srgb,#fff 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,#fff 7%,transparent) 1px,transparent 1px);background-size:28px 28px}
.bg-steel{background:var(--sheen-light);position:relative}
.bg-steel-dark{background:var(--sheen-dark);color:var(--text-on-brand)}
.bg-pipes{background-color:var(--surface-sunken);background-image:radial-gradient(circle at center,transparent 0 6px,color-mix(in srgb,var(--blue-500) 9%,transparent) 6px 7.5px,transparent 7.5px);background-size:26px 26px}
.bg-profiles{background-color:var(--surface-sunken);background-image:linear-gradient(color-mix(in srgb,var(--steel-400) 16%,transparent) var(--bw-1),transparent var(--bw-1)),linear-gradient(90deg,color-mix(in srgb,var(--steel-400) 16%,transparent) var(--bw-1),transparent var(--bw-1));background-size:22px 22px}
.stripe-hazard{background:repeating-linear-gradient(-45deg,var(--molten-400) 0 14px,var(--steel-900) 14px 28px)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== COMPONENTS ===== */
.as-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font-family:var(--font-sans);font-weight:var(--fw-bold);font-size:var(--fs-sm);line-height:1;white-space:nowrap;cursor:pointer;user-select:none;border:var(--bw-1) solid transparent;border-radius:var(--radius-sm);padding-block:0;height:44px;padding-inline:var(--space-5);background:var(--action-primary);color:#fff;transition:transform var(--dur-fast) var(--ease-out),background var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out)}
.as-btn:hover{background:var(--action-primary-hover)}
.as-btn:active{transform:scale(.98);background:var(--action-primary-press)}
.as-btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.as-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.as-btn svg{width:1.15em;height:1.15em}
.as-btn--accent{background:var(--action-accent);box-shadow:var(--shadow-accent)}
.as-btn--accent:hover{background:var(--action-accent-hover)}
.as-btn--accent:active{background:var(--action-accent-press)}
.as-btn--secondary{background:var(--surface-card);color:var(--action-primary);border-color:var(--border-strong)}
.as-btn--secondary:hover{background:var(--surface-brand-soft);border-color:var(--border-brand)}
.as-btn--secondary:active{background:var(--blue-100);transform:scale(.98)}
.as-btn--ghost{background:transparent;color:var(--text-body)}
.as-btn--ghost:hover{background:var(--surface-sunken)}
.as-btn--ghost:active{background:var(--steel-100);transform:scale(.98)}
.as-btn--steel{background:var(--sheen-dark);color:#fff;box-shadow:var(--shadow-inset),var(--shadow-sm);border-color:var(--steel-700)}
.as-btn--steel:hover{filter:brightness(1.12)}
.as-btn--sm{height:36px;font-size:var(--fs-xs);padding-inline:var(--space-4)}
.as-btn--lg{height:54px;font-size:var(--fs-md);padding-inline:var(--space-7);border-radius:var(--radius-md)}
.as-btn--block{display:flex;width:100%}
.as-iconbtn{display:inline-grid;place-items:center;cursor:pointer;width:44px;height:44px;border-radius:var(--radius-sm);border:var(--bw-1) solid var(--border-default);background:var(--surface-card);color:var(--text-body);transition:background var(--dur-base) var(--ease-out),transform var(--dur-fast) var(--ease-out),border-color var(--dur-base)}
.as-iconbtn:hover{background:var(--surface-sunken);color:var(--text-strong);border-color:var(--border-strong)}
.as-iconbtn:active{transform:scale(.94)}
.as-iconbtn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.as-iconbtn svg{width:20px;height:20px}
.as-iconbtn--ghost{border-color:transparent;background:transparent}
.as-iconbtn--sm{width:36px;height:36px}
.as-badge{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--fs-2xs);font-weight:var(--fw-bold);line-height:1;padding:5px 9px;border-radius:var(--radius-pill);background:var(--surface-brand-soft);color:var(--blue-700);letter-spacing:.02em}
.as-badge--accent{background:var(--molten-50);color:var(--molten-700)}
.as-badge--success{background:var(--success-50);color:var(--success-500)}
.as-badge--solid{background:var(--action-accent);color:#fff}
.as-tag{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--fs-xs);font-weight:var(--fw-medium);padding:6px 12px;border-radius:var(--radius-sm);border:var(--bw-1) solid var(--border-default);background:var(--surface-card);color:var(--text-body);font-family:var(--font-mono);direction:ltr}
.as-tag--active{border-color:var(--border-brand);background:var(--surface-brand-soft);color:var(--blue-700)}
.as-card{background:var(--surface-card);border:var(--bw-hair) solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:box-shadow var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out),border-color var(--dur-base)}
.as-card--pad{padding:var(--space-5)}
.as-card--hover:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--border-strong)}
.as-stat{display:flex;flex-direction:column;gap:var(--space-1)}
.as-stat__value{font-family:var(--font-mono);direction:ltr;font-size:var(--fs-h2);font-weight:var(--fw-bold);color:var(--text-strong);line-height:1}
.as-stat__label{font-size:var(--fs-sm);color:var(--text-muted)}
.as-stat__value .u{color:var(--action-accent)}
.as-divider{display:flex;align-items:center;gap:var(--space-3)}
.as-divider__line{flex:1;height:var(--bw-hair);background:var(--border-default)}
.as-divider__mark{width:28px;height:14px;border-radius:var(--radius-pill);background:var(--sheen-molten);flex:none}
.as-divider__mark--ring{width:16px;height:16px;border-radius:50%;background:transparent;border:var(--bw-3) solid var(--molten-400)}
.as-rating{display:inline-flex;gap:var(--space-1);direction:ltr}
.as-rating button{background:none;border:0;padding:2px;cursor:pointer;color:var(--steel-300);line-height:0;transition:color var(--dur-fast),transform var(--dur-fast)}
.as-rating button:hover{transform:scale(1.15)}
.as-rating button[data-on="true"]{color:var(--warning-500)}
.as-rating--readonly button{cursor:default}
.as-rating svg{width:26px;height:26px}
.as-rating--sm svg{width:18px;height:18px}
.as-lang{display:inline-flex;background:var(--surface-sunken);border:var(--bw-hair) solid var(--border-default);border-radius:var(--radius-pill);padding:3px;gap:2px}
.as-lang button{border:0;background:transparent;cursor:pointer;font-family:var(--font-mono);font-weight:600;font-size:var(--fs-xs);color:var(--text-muted);padding:6px 12px;border-radius:var(--radius-pill);transition:background var(--dur-base),color var(--dur-base)}
.as-lang button[aria-pressed="true"]{background:var(--surface-card);color:var(--blue-700);box-shadow:var(--shadow-xs)}
.as-whatsapp{display:inline-flex;align-items:center;gap:var(--space-2);background:#1fae54;color:#fff;font-weight:var(--fw-bold);font-size:var(--fs-sm);border:0;cursor:pointer;padding:0 var(--space-5);height:50px;border-radius:var(--radius-pill);box-shadow:var(--shadow-lg);transition:transform var(--dur-fast) var(--ease-out),filter var(--dur-base);text-decoration:none}
.as-whatsapp:hover{filter:brightness(1.06);text-decoration:none}
.as-whatsapp:active{transform:scale(.97)}
.as-whatsapp--fab{position:fixed;inset-block-end:22px;inset-inline-start:22px;z-index:60;width:56px;padding:0;justify-content:center}
.as-whatsapp svg{width:24px;height:24px}
.as-field{display:flex;flex-direction:column;gap:var(--space-2)}
.as-field__label{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-strong)}
.as-field__req{color:var(--danger-500);margin-inline-start:2px}
.as-field__hint{font-size:var(--fs-xs);color:var(--text-muted)}
.as-field__error{font-size:var(--fs-xs);color:var(--danger-500);font-weight:500}
.as-input,.as-select,.as-textarea{width:100%;font-family:var(--font-sans);font-size:var(--fs-md);color:var(--text-strong);background:var(--surface-card);border:var(--bw-1) solid var(--border-default);border-radius:var(--radius-sm);padding:0 var(--space-4);height:48px;transition:border-color var(--dur-base),box-shadow var(--dur-base),background var(--dur-base)}
.as-textarea{height:auto;min-height:110px;padding:var(--space-3) var(--space-4);line-height:var(--lh-normal);resize:vertical}
.as-input::placeholder,.as-textarea::placeholder{color:var(--text-subtle)}
.as-input:hover,.as-select:hover,.as-textarea:hover{border-color:var(--border-strong)}
.as-input:focus,.as-select:focus,.as-textarea:focus{outline:none;border-color:var(--border-brand);box-shadow:var(--focus-ring);background:var(--surface-card)}
.as-input--error,.as-select--error,.as-textarea--error{border-color:var(--danger-500)}
.as-input:disabled,.as-select:disabled,.as-textarea:disabled{background:var(--surface-sunken);color:var(--text-muted);cursor:not-allowed}
.as-select-wrap{position:relative}
.as-select{appearance:none;padding-inline-end:var(--space-7);cursor:pointer}
.as-select-wrap__chev{position:absolute;inset-inline-end:var(--space-4);inset-block-start:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted);width:18px;height:18px}
.as-input--spec{font-family:var(--font-mono);direction:ltr;text-align:start}
.as-filedrop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);text-align:center;padding:var(--space-6) var(--space-5);border:var(--bw-2) dashed var(--border-strong);border-radius:var(--radius-md);background:var(--surface-sunken);color:var(--text-muted);cursor:pointer;transition:border-color var(--dur-base),background var(--dur-base),color var(--dur-base)}
.as-filedrop:hover,.as-filedrop--drag{border-color:var(--border-brand);background:var(--surface-brand-soft);color:var(--blue-700)}
.as-filedrop svg{width:30px;height:30px}
.as-filedrop__title{font-weight:var(--fw-semibold);color:var(--text-strong);font-size:var(--fs-sm)}
.as-filedrop__hint{font-size:var(--fs-xs)}
.as-product{overflow:hidden;display:flex;flex-direction:column}
.as-product__media{position:relative;aspect-ratio:4/3;background:var(--surface-sunken);overflow:hidden;display:grid;place-items:center}
.as-product__spine{height:5px;background:var(--cat,var(--blue-500))}
.as-product__body{padding:var(--space-4) var(--space-5) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);flex:1}
.as-product__cat{font-size:var(--fs-2xs);font-weight:var(--fw-bold);letter-spacing:.04em;color:var(--cat,var(--blue-600))}
.as-product__title{font-size:var(--fs-h4);font-weight:var(--fw-bold);color:var(--text-strong);line-height:var(--lh-snug)}
.as-product__sizes{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:auto}
.as-product__foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding-top:var(--space-3);border-top:var(--bw-hair) solid var(--border-subtle)}
.as-cattile{position:relative;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-card);border:var(--bw-hair) solid var(--border-default);cursor:pointer;transition:box-shadow var(--dur-base),transform var(--dur-base),border-color var(--dur-base);text-align:start}
.as-cattile:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--border-strong)}
.as-cattile__icon{width:52px;height:52px;border-radius:var(--radius-md);display:grid;place-items:center;color:#fff;background:var(--cat,var(--blue-500));box-shadow:var(--shadow-sm)}
.as-cattile__icon svg{width:26px;height:26px}
.as-cattile__title{font-size:var(--fs-h4);font-weight:var(--fw-bold);color:var(--text-strong)}
.as-cattile__desc{font-size:var(--fs-sm);color:var(--text-muted);line-height:var(--lh-normal)}
.as-cattile__count{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-subtle);direction:ltr}
.as-cattile__bar{position:absolute;inset-block-start:0;inset-inline-start:0;inline-size:100%;block-size:4px;background:var(--cat,var(--blue-500))}

/* ===== KIT LAYOUT ===== */
body{background:var(--surface-page)}
.kit-page{padding-block:var(--space-8) var(--space-9)}
.kit-page__head{margin-bottom:var(--space-6)}
.kit-page__head h1{font-size:var(--fs-h1);margin-top:6px}
.kit-page__sub{color:var(--text-muted);margin-top:8px;max-width:60ch}
.kit-header{position:sticky;inset-block-start:0;z-index:50}
.kit-topbar{background:var(--steel-900);color:var(--steel-200);font-size:var(--fs-xs)}
.kit-topbar__in{display:flex;gap:var(--space-5);align-items:center;height:38px}
.kit-topbar__in span{display:inline-flex;align-items:center;gap:6px}
.kit-topbar__std{margin-inline-start:auto;color:var(--molten-300);font-weight:600}
.kit-nav{display:flex;align-items:center;gap:var(--space-5);height:76px;background:color-mix(in srgb,var(--steel-0) 86%,transparent);backdrop-filter:blur(10px);border-bottom:var(--bw-hair) solid var(--border-default)}
.kit-logo{display:flex;align-items:center;gap:10px;flex:none}
.kit-logo:hover{text-decoration:none}
.kit-logo__wm{display:flex;flex-direction:column;line-height:1.1}
.kit-logo__wm b{font-size:17px;font-weight:800;color:var(--text-strong)}

/* ===== UI PRIMITIVES ===== */
function Icon({ n, size=18, style }) {
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return <i data-lucide={n} style={{ width:size, height:size, display:'inline-block', ...style }} />;
}
function Btn({ variant='primary', size='md', block, iS, iE, children, className='', ...r }) {
  const c = ['as-btn', variant!=='primary'&&`as-btn--${variant}`, size!=='md'&&`as-btn--${size}`, block&&'as-btn--block', className].filter(Boolean).join(' ');
  return <button className={c} {...r}>{iS}{children!=null&&<span>{children}</span>}{iE}</button>;
}
function IBtn({ ghost, size, children, className='', ...r }) {
  return <button className={['as-iconbtn', ghost&&'as-iconbtn--ghost', size==='sm'&&'as-iconbtn--sm', className].filter(Boolean).join(' ')} {...r}>{children}</button>;
}
function Badge({ tone='brand', solid, children, ...r }) {
  return <span className={['as-badge', solid?'as-badge--solid':tone!=='brand'&&`as-badge--${tone}`].filter(Boolean).join(' ')} {...r}>{children}</span>;
}
function Tag({ active, children, ...r }) {
  return <span className={['as-tag', active&&'as-tag--active'].filter(Boolean).join(' ')} {...r}>{children}</span>;
}
function Card({ pad, hover, children, className='', ...r }) {
  return <div className={['as-card', pad&&'as-card--pad', hover&&'as-card--hover', className].filter(Boolean).join(' ')} {...r}>{children}</div>;
}
function Stat({ value, label }) {
  return <div className="as-stat"><div className="as-stat__value">{value}</div><div className="as-stat__label">{label}</div></div>;
}
function Divider() {
  return <div className="as-divider"><span className="as-divider__line"/><span className="as-divider__mark"/><span className="as-divider__line"/></div>;
}
function Field({ label, required, hint, children, className='' }) {
  return (<div className={['as-field',className].filter(Boolean).join(' ')}>
    {label&&<label className="as-field__label">{label}{required&&<span className="as-field__req">*</span>}</label>}
    {children}
    {hint&&<span className="as-field__hint">{hint}</span>}
  </div>);
}
function Input({ variant, className='', ...r }) {
  return <input className={['as-input', variant==='spec'&&'as-input--spec', className].filter(Boolean).join(' ')} {...r} />;
}
function Textarea({ className='', rows=4, ...r }) {
  return <textarea rows={rows} className={['as-textarea',className].filter(Boolean).join(' ')} {...r} />;
}
function Select({ options, placeholder, className='', ...r }) {
  return (<div className="as-select-wrap">
    <select className={['as-select',className].filter(Boolean).join(' ')} {...r}>
      {placeholder&&<option value="">{placeholder}</option>}
      {options&&options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
    <svg className="as-select-wrap__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6" strokeLinecap="round" strokeLinejoin="round"/></svg>
  </div>);
}
function FileDrop({ title, hint }) {
  const ref = React.useRef(null);
  const [drag, setDrag] = React.useState(false);
  const [names, setNames] = React.useState([]);
  const take = l => setNames(Array.from(l||[]).map(f=>f.name));
  return (<div className={['as-filedrop',drag&&'as-filedrop--drag'].filter(Boolean).join(' ')}
    onClick={()=>ref.current.click()}
    onDragOver={e=>{e.preventDefault();setDrag(true)}}
    onDragLeave={()=>setDrag(false)}
    onDrop={e=>{e.preventDefault();setDrag(false);take(e.dataTransfer.files)}}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
    <span className="as-filedrop__title">{names.length?names.join('، '):title}</span>
    <span className="as-filedrop__hint">{hint}</span>
    <input ref={ref} type="file" hidden multiple onChange={e=>take(e.target.files)}/>
  </div>);
}
function Stars({ value=0, onChange }) {
  return (<div className="as-rating">
    {[1,2,3,4,5].map(n=>(
      <button key={n} type="button" data-on={n<=value} onClick={()=>onChange&&onChange(n)}>
        <svg viewBox="0 0 24 24" fill={n<=value?'currentColor':'none'} stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.9l-5.8 3.05 1.1-6.45-4.7-4.6 6.5-.95z"/></svg>
      </button>
    ))}
  </div>);
}
function LangSwitch({ value='fa', onChange }) {
  return (<div className="as-lang" role="group">
    {[['fa','فا'],['en','EN'],['ar','ع']].map(([c,l])=>(
      <button key={c} type="button" aria-pressed={value===c} onClick={()=>onChange(c)}>{l}</button>
    ))}
  </div>);
}
function WA({ phone='', label='', fab }) {
  return (<a className={['as-whatsapp',fab&&'as-whatsapp--fab'].filter(Boolean).join(' ')} href={`https://wa.me/${phone}`} target="_blank" rel="noopener" aria-label={label}>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.86.5 3.6 1.36 5.1L2 22l5.2-1.5a9.8 9.8 0 0 0 4.84 1.27h.01c5.43 0 9.84-4.4 9.84-9.84C21.9 6.4 17.48 2 12.04 2zm5.76 13.9c-.24.68-1.4 1.3-1.94 1.34-.5.05-.96.23-3.24-.67-2.72-1.07-4.46-3.84-4.6-4.02-.13-.18-1.1-1.46-1.1-2.78 0-1.32.7-1.97.94-2.24.24-.27.52-.34.7-.34.18 0 .35 0 .5.01.16.01.38-.06.6.46.23.53.78 1.85.85 1.98.07.13.12.3.02.48-.1.18-.14.3-.28.46-.14.16-.3.36-.42.48-.14.14-.29.29-.12.57.16.27.73 1.2 1.56 1.95 1.07.95 1.97 1.25 2.25 1.39.28.14.44.12.6-.07.18-.2.7-.8.88-1.08.18-.27.36-.22.6-.13.25.09 1.57.74 1.84.87.27.14.45.2.52.32.07.12.07.66-.17 1.34z"/></svg>
    {!fab&&<span>{label}</span>}
  </a>);
}
function CatTile({ icon, title, desc, count, hue, onClick }) {
  return (<button className="as-cattile" style={{'--cat':hue}} onClick={onClick}>
    <span className="as-cattile__bar"/>
    <span className="as-cattile__icon"><Icon n={icon} size={26}/></span>
    <span className="as-cattile__title">{title}</span>
    {desc&&<span className="as-cattile__desc">{desc}</span>}
    {count!=null&&<span className="as-cattile__count">{count}</span>}
  </button>);
}
function ProdCard({ category, hue, title, sizes=[], badge, ctaLabel, onCta }) {
  return (<article className="as-card as-card--hover as-product" style={{'--cat':hue}}>
    <div className="as-product__spine"/>
    <div className="as-product__media bg-profiles">
      <Icon n="image" size={30} style={{color:'var(--steel-300)'}}/>
      {badge&&<div style={{position:'absolute',insetBlockStart:10,insetInlineEnd:10}}>{badge}</div>}
    </div>
    <div className="as-product__body">
      {category&&<span className="as-product__cat">{category}</span>}
      <h3 className="as-product__title">{title}</h3>
      {sizes.length>0&&<div className="as-product__sizes">{sizes.slice(0,3).map(s=><Tag key={s}>{s}</Tag>)}</div>}
      <div className="as-product__foot">
        <Btn variant="secondary" size="sm" onClick={onCta}>{ctaLabel}</Btn>
        <span className="spec" style={{fontSize:'var(--fs-xs)',color:'var(--text-subtle)'}}>6m · 12m</span>
      </div>
    </div>
  </article>);
}

/* ===== CHROME ===== */
function Logo({ t }) {
  return (<a href="#" className="kit-logo" onClick={e=>e.preventDefault()}>
    <img src="assets/logo-mark.svg" width="40" height="40" alt=""/>
    <span className="kit-logo__wm"><b>{t.brand}</b><small>{t.brandSub}</small></span>
  </a>);
}
function Header({ lang, setLang, page, setPage, t }) {
  const [open, setOpen] = React.useState(false);
  const items=[['home',t.nav.home],['products',t.nav.products],['profiles',t.nav.profiles],['gas',t.nav.gas],['water',t.nav.water],['about',t.nav.about],['contact',t.nav.contact]];
  const go=p=>{setPage(p);setOpen(false)};
  return (<header className="kit-header">
    <div className="kit-topbar">
      <div className="container kit-topbar__in">
        <span><Icon n="phone" size={13}/> <span className="spec">+98 6067</span></span>
        <span><Icon n="map-pin" size={13}/> {lang==='en'?'Delijan, Markazi, Iran':lang==='ar'?'دليجان، مركزي، إيران':'دلیجان، مرکزی، ایران'}</span>
        <span className="kit-topbar__std spec">ISIRI · ASTM</span>
      </div>
    </div>
    <div className="container kit-nav">
      <Logo t={t}/>
      <nav className="kit-nav__links">
        {items.map(([id,label])=>(
          <button key={id} className={'kit-nav__link'+(page===id?' is-active':'')} onClick={()=>go(id)}>{label}</button>
        ))}
      </nav>
      <div className="kit-nav__actions">
        <IBtn ghost aria-label="search"><Icon n="search" size={20}/></IBtn>
        <LangSwitch value={lang} onChange={setLang}/>
        <Btn variant="accent" size="sm" className="kit-nav__cta" iS={<Icon n="file-text" size={16}/>} onClick={()=>go('inquiry')}>{t.cta.quote}</Btn>
        <IBtn ghost className="kit-burger" aria-label="menu" onClick={()=>setOpen(o=>!o)}><Icon n={open?'x':'menu'} size={22}/></IBtn>
      </div>
    </div>
    {open&&<nav className="kit-mobnav">{items.map(([id,label])=><button key={id} className={'kit-mobnav__link'+(page===id?' is-active':'')} onClick={()=>go(id)}>{label}</button>)}</nav>}
  </header>);
}
function Footer({ t, lang, setPage }) {
  const col=(title,links)=>(<div className="kit-foot__col"><h4>{title}</h4>{links.map(l=><button key={l[1]} onClick={()=>setPage(l[0])}>{l[1]}</button>)}</div>);
  return (<footer className="kit-foot bg-steel-dark">
    <div className="stripe-hazard" style={{height:6}}/>
    <div className="container kit-foot__grid">
      <div className="kit-foot__brand">
        <img src="assets/logo-mark.svg" width="46" height="46" alt=""/>
        <b>{t.brand}</b>
        <p>{t.hero.sub}</p>
        <div className="kit-foot__social"><WA phone="989120000000" label={lang==='en'?'WhatsApp':'واتس‌اپ'}/></div>
      </div>
      {col(t.nav.products,[['profiles',t.nav.profiles],['gas',t.nav.gas],['water',t.nav.water],['products',t.nav.products]])}
      {col(lang==='en'?'Company':lang==='ar'?'الشركة':'شرکت',[['about',t.nav.about],['contact',t.nav.contact],['survey',t.sec.survey]])}
      <div className="kit-foot__col">
        <h4>{t.nav.contact}</h4>
        <span className="kit-foot__line"><Icon n="phone" size={15}/> <span className="spec">+98 6067</span></span>
        <span className="kit-foot__line"><Icon n="mail" size={15}/> <span className="spec">info@ariasteel.ir</span></span>
        <span className="kit-foot__line"><Icon n="map-pin" size={15}/> {lang==='en'?'Delijan Industrial Zone':'شهرک صنعتی دلیجان'}</span>
        <div className="kit-foot__map bg-blueprint"><Icon n="map" size={22} style={{color:'#fff',opacity:.8}}/><span>{lang==='en'?'Google Maps':'موقعیت روی نقشه'}</span></div>
      </div>
    </div>
    <div className="container kit-foot__bottom">
      <span>© ۱۴۰۴ {t.brand} — {lang==='en'?'All rights reserved':lang==='ar'?'جميع الحقوق محفوظة':'تمام حقوق محفوظ است'}</span>
      <span className="spec">ISIRI · ASTM · API</span>
    </div>
  </footer>);
}

/* ===== PAGES ===== */
function Eyebrow({ children }) { return <div className="eyebrow">{children}</div>; }
function SecHead({ kicker, title, sub, center }) {
  return (<div className={'kit-sechead'+(center?' is-center':'')}>
    <Eyebrow>{kicker}</Eyebrow><h2>{title}</h2>{sub&&<p>{sub}</p>}
    <div style={{maxWidth:center?220:120,margin:center?'14px auto 0':'14px 0 0'}}><Divider/></div>
  </div>);
}

function PipeCanvas() {
  const images = [
    'assets/hero/pipes-1.jpeg',
    'assets/hero/pipes-2.webp',
    'assets/hero/profiles-1.jpeg',
    'assets/hero/factory-1.jpeg',
    'assets/hero/factory-2.jpeg',
  ];
  const [active, setActive] = React.useState(0);
  React.useEffect(() => {
    const iv = setInterval(() => setActive(a => (a + 1) % images.length), 5000);
    return () => clearInterval(iv);
  }, []);
  return (
    <div className="kit-hero__canvas" aria-hidden="true">
      {images.map((src, i) => (
        <img key={i} src={src} alt="" className={`hero-slide${i === active ? ' active' : ''}`}
          style={{ animationDelay: `${i * 2}s` }} loading={i === 0 ? 'eager' : 'lazy'}
          onError={e => { e.target.style.display = 'none'; }} />
      ))}
    </div>
  );
}

function Hero({ t, lang, setPage }) {
  return (<section className="kit-hero bg-blueprint">
    <PipeCanvas/>
    <div className="container kit-hero__in">
      <div className="kit-hero__copy">
        <Eyebrow>{t.hero.eyebrow}</Eyebrow>
        <h1 className="kit-hero__title">{t.hero.title}</h1>
        <p className="kit-hero__sub">{t.hero.sub}</p>
        <div className="kit-hero__cta">
          <Btn variant="accent" size="lg" iS={<Icon n="file-text" size={18}/>} onClick={()=>setPage('inquiry')}>{t.cta.quote}</Btn>
          <Btn variant="steel" size="lg" iS={<Icon n="download" size={18}/>}>{t.cta.catalog}</Btn>
        </div>
        <div className="kit-hero__trust">
          {t.trust.map(x=><span key={x}><Icon n="check-circle-2" size={16}/> {x}</span>)}
        </div>
      </div>
      <div className="kit-hero__visual">
        <div className="kit-hero__pipe" aria-hidden="true">
          <span className="ring r1"/><span className="ring r2"/><span className="ring r3"/>
          <span className="sq s1"/><span className="sq s2"/>
        </div>
      </div>
    </div>
    <div className="container kit-hero__stats">
      {t.stats.map(([v,l])=><Stat key={l} value={<span className="spec">{v}</span>} label={l}/>)}
    </div>
  </section>);
}

function Categories({ t, lang, setPage }) {
  return (<section className="kit-sec container">
    <SecHead kicker={t.cta.more} title={t.sec.cats} sub={t.sec.catsSub} center/>
    <div className="kit-catgrid">
      {CATS.map(c=><CatTile key={c.id} icon={c.icon} hue={c.hue} title={c.name[lang]} desc={c.desc[lang]} count={c.count+(lang==='en'?' sizes':lang==='ar'?' مقاس':' سایز')} onClick={()=>setPage('products')}/>)}
    </div>
  </section>);
}

function Featured({ t, lang, setPage }) {
  return (<section className="kit-sec bg-pipes">
    <div className="container">
      <SecHead kicker="Best Sellers" title={t.sec.featured} center/>
      <div className="kit-prodgrid">
        {PRODUCTS.slice(0,4).map((p,i)=>{
          const c=CATS.find(x=>x.id===p.cat);
          const badge=p.badge==='hot'?<Badge tone="accent" solid>{lang==='en'?'Best seller':lang==='ar'?'الأكثر مبيعاً':'پرفروش'}</Badge>
            :p.badge==='new'?<Badge tone="success">{lang==='en'?'New':lang==='ar'?'جديد':'جدید'}</Badge>:null;
          return <ProdCard key={i} hue={c.hue} category={c.name[lang]} title={p.name[lang]} sizes={p.sizes} badge={badge} ctaLabel={t.cta.quote} onCta={()=>setPage('inquiry')}/>;
        })}
      </div>
    </div>
  </section>);
}

function WhyUs({ t }) {
  return (<section className="kit-sec container">
    <SecHead kicker="Aria Steel" title={t.sec.why} center/>
    <div className="kit-whygrid">
      {t.why.map(([icon,title,desc])=>(
        <Card key={title} pad className="kit-why">
          <span className="kit-why__icon"><Icon n={icon} size={24}/></span>
          <h3>{title}</h3><p>{desc}</p>
        </Card>
      ))}
    </div>
  </section>);
}

function CtaBand({ t, setPage, lang }) {
  return (<section className="kit-ctaband bg-steel-dark">
    <div className="container kit-ctaband__in">
      <div>
        <Eyebrow>{t.hero.eyebrow}</Eyebrow>
        <h2>{lang==='en'?'Need a price? Send your list today.':lang==='ar'?'تحتاج سعراً؟ أرسل قائمتك اليوم.':'به قیمت نیاز دارید؟ همین حالا لیست خود را ارسال کنید.'}</h2>
      </div>
      <div className="kit-ctaband__btns">
        <Btn variant="accent" size="lg" iS={<Icon n="file-text" size={18}/>} onClick={()=>setPage('inquiry')}>{t.cta.quote}</Btn>
        <Btn variant="secondary" size="lg" iS={<Icon n="phone" size={18}/>}>{t.cta.call}</Btn>
      </div>
    </div>
  </section>);
}

function Home(props) {
  return (<React.Fragment>
    <Hero {...props}/><Categories {...props}/><Featured {...props}/><WhyUs {...props}/><CtaBand {...props}/>
  </React.Fragment>);
}

function Products({ t, lang, setPage }) {
  const [active, setActive]=React.useState('all');
  const [q, setQ]=React.useState('');
  const list=PRODUCTS.filter(p=>(active==='all'||p.cat===active)&&(!q||p.sizes.join(' ').toLowerCase().includes(q.toLowerCase())||p.name[lang].includes(q)));
  return (<section className="kit-page container">
    <div className="kit-page__head"><Eyebrow>{t.nav.products}</Eyebrow><h1>{t.sec.cats}</h1></div>
    <div className="kit-prodlayout">
      <aside className="kit-filters">
        <Card pad>
          <h4 className="kit-filters__title">{lang==='en'?'Search by size':lang==='ar'?'البحث بالمقاس':'جستجوی سایز'}</h4>
          <Input variant="spec" placeholder="40×40×2" value={q} onChange={e=>setQ(e.target.value)}/>
          <h4 className="kit-filters__title" style={{marginTop:18}}>{lang==='en'?'Category':lang==='ar'?'الفئة':'دسته‌بندی'}</h4>
          <div className="kit-filters__cats">
            <button className={'kit-filterchip'+(active==='all'?' is-active':'')} onClick={()=>setActive('all')}>{lang==='en'?'All':lang==='ar'?'الكل':'همه'}</button>
            {CATS.map(c=><button key={c.id} className={'kit-filterchip'+(active===c.id?' is-active':'')} style={{'--cat':c.hue}} onClick={()=>setActive(c.id)}><span className="dot"/>{c.name[lang]}</button>)}
          </div>
        </Card>
      </aside>
      <div>
        <div className="kit-prodbar">
          <span className="spec">{list.length} {lang==='en'?'products':lang==='ar'?'منتج':'محصول'}</span>
          <Btn variant="ghost" size="sm" iS={<Icon n="download" size={16}/>}>{t.cta.catalog}</Btn>
        </div>
        <div className="kit-prodgrid kit-prodgrid--3">
          {list.map((p,i)=>{const c=CATS.find(x=>x.id===p.cat);return <ProdCard key={i} hue={c.hue} category={c.name[lang]} title={p.name[lang]} sizes={p.sizes} ctaLabel={t.cta.quote} onCta={()=>setPage('inquiry')}/>;  })}
        </div>
      </div>
    </div>
  </section>);
}

function Inquiry({ t, lang }) {
  const [sent, setSent]=React.useState(false);
  const ptypes=lang==='en'?['Steel profile','Gas pipe','Water pipe','Industrial pipe','Custom size']:lang==='ar'?['مقطع فولاذي','أنبوب غاز','أنبوب مياه','أنبوب صناعي','مقاس مخصص']:['پروفیل فولادی','لوله گاز','لوله آب','لوله صنعتی','سایز سفارشی'];
  if (sent) return (<section className="kit-page container kit-thanks">
    <div className="kit-thanks__icon"><Icon n="check-circle-2" size={44}/></div>
    <h1>{lang==='en'?'Request received':lang==='ar'?'تم استلام الطلب':'درخواست شما ثبت شد'}</h1>
    <p>{lang==='en'?'Our experts will contact you within one business day.':lang==='ar'?'سيتواصل خبراؤنا خلال يوم عمل.':'کارشناسان ما در کمتر از یک روز کاری با شما تماس می‌گیرند.'}</p>
    <Btn variant="secondary" onClick={()=>setSent(false)} iS={<Icon n="rotate-ccw" size={16}/>}>{lang==='en'?'New request':'درخواست جدید'}</Btn>
  </section>);
  return (<section className="kit-page container">
    <div className="kit-page__head"><Eyebrow>{t.cta.quote}</Eyebrow><h1>{t.sec.inquiry}</h1><p className="kit-page__sub">{t.sec.inquirySub}</p></div>
    <div className="kit-formwrap">
      <Card pad>
        <form onSubmit={e=>{e.preventDefault();setSent(true)}}>
          <div className="kit-form__grid">
            <Field label={lang==='en'?'Full name':lang==='ar'?'الاسم الكامل':'نام و نام خانوادگی'} required><Input required placeholder={lang==='en'?'e.g. Ali Rezaei':'مثلاً علی رضایی'}/></Field>
            <Field label={lang==='en'?'Company':lang==='ar'?'الشركة':'نام شرکت'}><Input placeholder={lang==='en'?'Optional':'اختیاری'}/></Field>
            <Field label={lang==='en'?'Mobile':lang==='ar'?'الجوال':'شماره موبایل'} required><Input variant="spec" required placeholder="0912 000 0000"/></Field>
            <Field label={lang==='en'?'City / Province':lang==='ar'?'المدينة / المحافظة':'شهر / استان'}><Input placeholder={lang==='en'?'e.g. Tehran':'مثلاً تهران'}/></Field>
            <Field label={lang==='en'?'Field of activity':lang==='ar'?'مجال النشاط':'زمینه فعالیت'}><Select placeholder={lang==='en'?'Select':'انتخاب کنید'} options={FIELDS[lang]}/></Field>
            <Field label={lang==='en'?'Product category':lang==='ar'?'فئة المنتج':'دسته محصول'} required><Select required placeholder={lang==='en'?'Select':'انتخاب کنید'} options={CATS.map(c=>c.name[lang])}/></Field>
            <Field label={lang==='en'?'Product type':lang==='ar'?'نوع المنتج':'نوع محصول'}><Select placeholder={lang==='en'?'Select':'انتخاب کنید'} options={ptypes}/></Field>
            <Field label={lang==='en'?'Size / thickness / qty':lang==='ar'?'المقاس / السماكة / الكمية':'سایز / ضخامت / تعداد'} required hint={lang==='en'?'e.g. 40×40×2 mm — 200 pcs':'مثلاً ۴۰×۴۰×۲ — ۲۰۰ شاخه'}><Input variant="spec" required placeholder="40×40×2 mm × 200"/></Field>
            <div className="kit-form__full"><Field label={lang==='en'?'Notes':lang==='ar'?'ملاحظات':'توضیحات'}><Textarea placeholder={lang==='en'?'Anything else we should know…':'توضیحات تکمیلی…'}/></Field></div>
            <div className="kit-form__full"><Field label={lang==='en'?'Attach product list (optional)':'بارگذاری لیست محصول (اختیاری)'}><FileDrop title={lang==='en'?'Drop a file or click to upload':'فایل را بکشید یا برای انتخاب کلیک کنید'} hint="PDF · XLSX · JPG — max 10MB"/></Field></div>
          </div>
          <div className="kit-form__actions">
            <Btn type="submit" variant="accent" size="lg" iS={<Icon n="send" size={18}/>}>{t.cta.submit}</Btn>
            <span className="kit-form__note"><Icon n="lock" size={14}/> {lang==='en'?'Sent to sales / WhatsApp / CRM':'ارسال به فروش / واتس‌اپ / CRM'}</span>
          </div>
        </form>
      </Card>
      <aside className="kit-formaside">
        <Card pad>
          <h4><Icon n="headphones" size={18}/> {t.cta.call}</h4>
          <p className="spec" style={{fontSize:16,marginTop:8}}>+98 6067</p>
          <p style={{marginTop:6,color:'var(--text-muted)',fontSize:14}}>{lang==='en'?'Sat–Thu, 8:00–17:00':'شنبه تا پنجشنبه، ۸ تا ۱۷'}</p>
        </Card>
        <Card pad className="bg-steel">
          <h4><Icon n="zap" size={18}/> {lang==='en'?'Why request a quote?':'مزایای استعلام'}</h4>
          <ul className="kit-perklist">{t.trust.map(x=><li key={x}><Icon n="check" size={15}/>{x}</li>)}</ul>
        </Card>
      </aside>
    </div>
  </section>);
}

function Survey({ t, lang }) {
  const items=lang==='en'?[['Product quality','shield-check'],['Delivery speed','truck'],['Sales support','headphones'],['Price satisfaction','tag']]:lang==='ar'?[['جودة المنتج','shield-check'],['سرعة التسليم','truck'],['دعم المبيعات','headphones'],['الرضا عن السعر','tag']]:[['کیفیت محصول','shield-check'],['سرعت تحویل','truck'],['پشتیبانی فروش','headphones'],['رضایت از قیمت','tag']];
  const [r,setR]=React.useState({});
  const [done,setDone]=React.useState(false);
  if (done) return (<section className="kit-page container kit-thanks">
    <div className="kit-thanks__icon"><Icon n="heart-handshake" size={44}/></div>
    <h1>{lang==='en'?'Thank you!':lang==='ar'?'شكراً لك!':'از شما متشکریم!'}</h1>
    <p>{lang==='en'?'Your feedback was recorded.':'نظر شما ثبت شد.'}</p>
  </section>);
  return (<section className="kit-page container">
    <div className="kit-page__head"><Eyebrow>{t.nav.about}</Eyebrow><h1>{t.sec.survey}</h1><p className="kit-page__sub">{t.sec.surveySub}</p></div>
    <Card pad className="kit-survey">
      <form onSubmit={e=>{e.preventDefault();setDone(true)}}>
        <div className="kit-survey__rows">
          {items.map(([label,icon])=>(
            <div key={label} className="kit-survey__row">
              <span className="kit-survey__label"><span className="kit-survey__ic"><Icon n={icon} size={18}/></span>{label}</span>
              <Stars value={r[label]||0} onChange={v=>setR(s=>({...s,[label]:v}))}/>
            </div>
          ))}
        </div>
        <Field className="kit-survey__notes" label={lang==='en'?'Suggestions & comments':lang==='ar'?'الاقتراحات والملاحظات':'پیشنهادها و نظرات'}><Textarea placeholder={lang==='en'?'Tell us how we can improve…':'بفرمایید چطور می‌توانیم بهتر شویم…'}/></Field>
        <div className="kit-form__actions"><Btn type="submit" variant="accent" size="lg" iS={<Icon n="send" size={18}/>}>{t.cta.submit}</Btn></div>
      </form>
    </Card>
  </section>);
}

/* ===== APP ===== */
function App() {
  const [lang, setLangState]=React.useState(()=>localStorage.getItem('aria-lang')||'fa');
  const [page, setPage]=React.useState('home');
  const t=T[lang];
  const setLang=l=>{setLangState(l);localStorage.setItem('aria-lang',l)};
  React.useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=DIRS[lang]},[lang]);
  React.useEffect(()=>{window.scrollTo(0,0)},[page]);
  React.useEffect(()=>{window.lucide&&window.lucide.createIcons()});
  const Screen={home:Home,products:Products,profiles:Products,gas:Products,water:Products,inquiry:Inquiry,contact:Inquiry,about:Home,survey:Survey}[page]||Home;
  return (<div dir={DIRS[lang]} lang={lang}>
    <Header lang={lang} setLang={setLang} page={page} setPage={setPage} t={t}/>
    <main><Screen t={t} lang={lang} setLang={setLang} page={page} setPage={setPage}/></main>
    <Footer t={t} lang={lang} setPage={setPage}/>
    <WA phone="989120000000" label="واتس‌اپ" fab/>
  </div>);
}
